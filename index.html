<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📚 Le Cercle des Cerveaux Disparus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         CHOIX DU PROFIL
    ====================================================== -->

    <div id="ecran-profil" class="overlay">

        <div class="card shadow-lg p-4 text-center profile-card">

            <h2>Qui es-tu ?</h2>

            <p class="text-muted">
                Choisis ton profil
            </p>

            <div class="d-grid gap-3">

                <button
                    class="btn btn-outline-danger btn-lg"
                    onclick="choisirProfil('Matide')">
                    😈 Matide
                </button>

                <button
                    class="btn btn-outline-primary btn-lg"
                    onclick="choisirProfil('Flaure')">
                    😻 Flaure
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <div id="application" class="cache">

        <header class="bg-white shadow-sm border-bottom py-4">

            <div class="container text-center">

                <h1 class="fw-bold">
                    📚 Le Cercle des Cerveaux Disparus
                </h1>

                <p id="message-bienvenue"
                   class="badge bg-secondary">
                </p>

                <nav class="mt-3 d-flex flex-wrap justify-content-center gap-2">

                    <button class="btn btn-outline-dark"
                            data-vue="Matide">
                        Bibliothèque Matide
                    </button>

                    <button class="btn btn-outline-dark"
                            data-vue="Flaure">
                        Bibliothèque Flaure
                    </button>

                    <button class="btn btn-outline-dark"
                            data-vue="Commune">
                        Bibliothèque Commune
                    </button>

                    <button class="btn btn-outline-success"
                            data-vue="PAL">
                        PAL
                    </button>

                    <button class="btn btn-outline-danger"
                            data-vue="CoupsDeCoeur">
                        ❤️ Coups de cœur
                    </button>

                </nav>

            </div>

        </header>


        <main class="container py-4">

            <!-- =========================
                 STATISTIQUES
            ========================== -->

            <section id="widgets"
                     class="row g-3 mb-4">

                <div class="col-6 col-md-3">
                    <div class="widget">
                        <small>Livres lus</small>
                        <h3 id="stat-lus">0</h3>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="widget">
                        <small>Budget</small>
                        <h3 id="stat-budget">0 €</h3>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="widget">
                        <small>Pages</small>
                        <h3 id="stat-pages">0</h3>
                    </div>
                </div>

                <div class="col-6 col-md-3">
                    <div class="widget">
                        <small>Genres</small>
                        <div id="stat-genres"></div>
                    </div>
                </div>

            </section>


            <!-- =========================
                 CITATION
            ========================== -->

            <section class="mb-5">

                <div class="card bg-dark text-white">

                    <div class="card-body text-center">

                        <p id="citation-texte"
                           class="fs-5 fst-italic">
                        </p>

                        <small id="citation-source"></small>

                        <div class="mt-3">

                            <button class="btn btn-outline-light btn-sm"
                                    onclick="afficherCitationAleatoire()">
                                🔄 Nouvelle citation
                            </button>

                        </div>

                    </div>

                </div>

            </section>


            <!-- =========================
                 CARROUSEL
            ========================== -->

            <section id="section-carousel"
                     class="mb-5">

                <h4>
                    ✨ Dernières lectures terminées
                </h4>

                <div id="carousel-livres"
                     class="carousel-container">
                </div>

            </section>


            <!-- =========================
                 BOUTON AJOUT
            ========================== -->

            <div class="text-center mb-4">

                <button id="btn-ajouter-livre"
                        class="btn btn-success btn-lg">
                    + Ajouter un livre
                </button>

            </div>


            <!-- =========================
                 TITRE DE VUE
            ========================== -->

            <h4 id="titre-grille"
                class="fw-bold mb-3">
                Bibliothèque
            </h4>


            <!-- =========================
                 LISTE DES LIVRES
            ========================== -->

            <section id="grille-livres"
                     class="row g-4">
            </section>

        </main>

    </div>


    <!-- =====================================================
         MODALES
    ====================================================== -->

    <div id="modal-formulaire" class="overlay cache"></div>

    <div id="modal-fiche" class="overlay cache"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
