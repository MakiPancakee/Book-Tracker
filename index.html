<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Le Cercle des Cerveaux Disparus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- ÉCRAN 1 : CHOIX DU PROFIL -->
    <div id="ecran-profil"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-75"
        style="z-index: 1050;">
        <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 90%;">
            <div class="card-body">
                <h2 class="card-title mb-3">Qui es-tu ?</h2>
                <p class="card-text text-muted mb-4">Choisis ton profil pour accéder à la bibliothèque.</p>
                <div class="d-grid gap-3">
                    <button class="btn btn-outline-danger btn-lg fw-bold" onclick="choisirProfil('Mathilde')">😈 Matide
                        😈</button>
                    <button class="btn btn-outline-primary btn-lg fw-bold" onclick="choisirProfil('Flore')">😻 Flaure
                        😻</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ÉCRAN 2 : L'APPLICATION PRINCIPALE -->
    <div id="application-principale" class="cache">

        <!-- En-tête -->
        <header class="bg-white border-bottom shadow-sm py-4 mb-4">
            <div class="container text-center">
                <h1 class="fw-bold mb-2">📚 Le Cercle des Cerveaux Disparus</h1>
                <p id="message-bienvenue" class="badge bg-secondary fs-6 fw-normal mb-3"></p>

                <nav class="d-flex justify-content-center gap-2 flex-wrap">
                    <button class="btn btn-outline-dark" onclick="changerVue('Mathilde')">Bibliothèque Matide</button>
                    <button class="btn btn-outline-dark" onclick="changerVue('Flore')">Bibliothèque Flaure</button>
                    <button class="btn btn-dark" onclick="changerVue('Commune')">Bibliothèque Commune</button>
                    <button class="btn btn-outline-success" onclick="changerVue('PAL')">Pile à lire (PAL)</button>
                </nav>
            </div>
        </header>

        <!-- Contenu principal -->
        <main class="container my-4">
            <div class="row justify-content-center mb-4">
                <div class="col-md-8 col-lg-6">
                    <button id="btn-ajouter-livre" class="btn btn-success btn-lg w-100 shadow-sm fw-bold"
                        onclick="ouvrirFormulaire()">
                        + Ajouter un livre
                    </button>
                </div>
            </div>

            <section id="grille-livres" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <!-- Les cartes s'insèrent ici -->
            </section>
        </main>
    </div>

    <!-- ÉCRAN 3 : FORMULAIRE D'AJOUT -->
    <div id="modal-formulaire"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-75 cache"
        style="z-index: 1050;">
        <div class="card shadow-lg w-100" style="max-width: 500px; margin: 15px;">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Ajouter une lecture</h5>
            </div>
            <div class="card-body">
                <form id="form-livre">
                    <div class="mb-3">
                        <label for="titre" class="form-label fw-bold">Titre du livre :</label>
                        <input type="text" id="titre" class="form-control" placeholder="ex: Fourth Wing" required>
                    </div>

                    <div class="mb-3">
                        <label for="auteur" class="form-label fw-bold">Auteur :</label>
                        <input type="text" id="auteur" class="form-control" placeholder="ex: Rebecca Yarros" required>
                    </div>

                    <div class="mb-3">
                        <label for="statut" class="form-label fw-bold">Statut :</label>
                        <select id="statut" class="form-select">
                            <option value="À lire">À lire 📚</option>
                            <option value="En cours">En cours 📖</option>
                            <option value="Pause">Pause ⏸</option>
                            <option value="Terminé">Terminé ✔️</option>
                            <option value="Abandonné">Abandonné ❌☠️</option>
                        </select>
                    </div>

                    <!-- Sélecteur de note par étoiles -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Note :</label>
                        <div id="star-rating-creation" class="fs-3" style="cursor: pointer; user-select: none;">
                            <span onclick="selectionnerEtoileCreation(1)" class="text-muted">★</span>
                            <span onclick="selectionnerEtoileCreation(2)" class="text-muted">★</span>
                            <span onclick="selectionnerEtoileCreation(3)" class="text-muted">★</span>
                            <span onclick="selectionnerEtoileCreation(4)" class="text-muted">★</span>
                            <span onclick="selectionnerEtoileCreation(5)" class="text-muted">★</span>
                        </div>
                        <input type="hidden" id="nouveau-note" value="0">
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-secondary" onclick="fermerFormulaire()">Annuler</button>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- POP-UP : FICHE DÉTAILLÉE DU LIVRE -->
    <div id="modal-fiche" class="cache"
        style="position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.75); z-index: 9999; display: flex; align-items: center; justify-content: center;">

        <div class="card shadow-lg p-4 bg-white position-relative"
            style="max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto; border-radius: 12px;">

            <button type="button" class="btn-close position-absolute top-0 end-0 m-3"
                onclick="fermerFicheLivre()"></button>
            <div id="fiche-details"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
