<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Le Cercle des Cerveaux Disparus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- ÉCRAN 1 : CHOIX DU PROFIL (Visible uniquement la première fois) -->
    <div id="ecran-profil"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-75"
        style="z-index: 1050;">
        <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 90%;">
            <div class="card-body">
                <h2 class="card-title mb-3">Qui es-tu ?</h2>
                <p class="card-text text-muted mb-4">Choisis ton profil pour accéder à la bibliothèque.</p>
                <div class="d-grid gap-3">
                    <button class="btn btn-outline-danger btn-lg fw-bold" onclick="choisirProfil('Matide')">😈 Matide
                        😈</button>
                    <button class="btn btn-outline-primary btn-lg fw-bold" onclick="choisirProfil('Flaure')">😻 Flaure
                        😻</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ÉCRAN 2 : L'APPLICATION PRINCIPALE (Cachée par défaut) -->
    <div id="application-principale" class="cache">

        <!-- L'en-tête avec les menus -->
        <header class="bg-white border-bottom shadow-sm py-4 mb-4">
            <div class="container text-center">
                <h1 class="fw-bold mb-2">📚 Le Cercle des Cerveaux Disparus</h1>
                <p id="message-bienvenue" class="badge bg-secondary fs-6 fw-normal mb-3"></p>

                <nav class="d-flex justify-content-center gap-2 flex-wrap">
                    <button class="btn btn-outline-dark" onclick="changerVue('Matide')">Bibliothèque Matide</button>
                    <button class="btn btn-outline-dark" onclick="changerVue('Flaure')">Bibliothèque Flaure</button>
                    <button class="btn btn-dark" onclick="changerVue('Commune')">Bibliothèque Commune</button>
                    <!-- Bouton Pile à lire -->
                    <button onclick="changerVue('PAL')">Pile à lire (PAL)</button>
                </nav>
            </div>
        </header>

        <!-- Contenu principal -->
        <main class="container my-4">
            <!-- Bouton pour ajouter un livre -->
            <div class="row justify-content-center mb-4">
                <div class="col-md-8 col-lg-6">
                    <button id="btn-ajouter-livre" class="btn btn-success btn-lg w-100 shadow-sm fw-bold"
                        onclick="ouvrirFormulaire()">
                        + Ajouter un livre
                    </button>
                </div>
            </div>

            <!-- Grille responsive des livres -->
            <section id="grille-livres" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <!-- Les livres affichés par JavaScript s'inséreront ici -->
            </section>
        </main>
    </div>

    <!-- Modal Fiche Détaillée -->
    <div id="modal-fiche" class="modal-arriere-plan cache">
        <div class="modal-contenu p-4 style=" max-width: 700px; margin: auto; background: white; border-radius: 8px;
            position: relative;">
            <button type="button" class="btn-close" style="position: absolute; top: 15px; right: 15px;"
                onclick="fermerFicheLivre()"></button>
            <div id="fiche-details"></div>
        </div>
    </div>

    <!-- ÉCRAN 3 : LE FORMULAIRE D'AJOUT (Fenêtre modale) -->
    <div id="modal-formulaire"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-75 cache"
        style="z-index: 1050;">
        <div class="card shadow-lg w-100" style="max-width: 500px; margin: 15px;">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Ajouter une lecture</h5>
            </div>
            <div class="card-body">
                <form id="form-livre">
                    <div class="mb-3">
                        <label for="titre" class="form-label fw-bold">Titre du livre :</label>
                        <input type="text" id="titre" class="form-control" placeholder="ex: Fourth Wing" required>
                    </div>

                    <div class="mb-3">
                        <label for="auteur" class="form-label fw-bold">Auteur :</label>
                        <input type="text" id="auteur" class="form-control" placeholder="ex: Rebecca Yarros" required>
                    </div>

                    <div class="mb-3">
                        <label for="statut" class="form-label fw-bold">Statut :</label>
                        <select id="statut" class="form-select">
                            <option value="À lire">À lire</option>
                            <option value="Abandonné ❌☠️">Abandonné ❌☠️</option>
                            <option value="En cours 📖">En cours 📖</option>
                            <option value="Pause ⏸">Pause ⏸</option>
                            <option value="Terminé ✔️">Terminé ✔️</option>
                        </select>
                    </div>

                    <!-- Tes futurs champs viendront s'insérer ici -->

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-secondary" onclick="fermerFormulaire()">Annuler</button>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
